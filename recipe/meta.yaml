{% set version = "1.1.0" %}

package:
  name: pylibsrtp
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pylibsrtp/pylibsrtp-{{ version }}.tar.gz
  sha256: e98d65f1bc3f1ac328bc78b19d2a38f6f01b922d2f0b8b68fc6371a6b79e07fe

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - cross-python_{{ target_platform }}  # [build_platform != target_platform]
    - python                              # [build_platform != target_platform]
    - cffi                                # [build_platform != target_platform]
  host:
    - python
    - cffi
    - setuptools
    - wheel
    - pip
    - libsrtp2
  run:
    - python
    - cffi

test:
  imports:
    - pylibsrtp
  commands:
    - pip check
  requires:
    - pip

about:
  summary: Python wrapper around the libsrtp (2) library
  license: BSD-3-Clause
  license_file: LICENSE
  home: https://github.com/aiortc/pylibsrtp

extra:
  recipe-maintainers:
    - hmaarrfk
